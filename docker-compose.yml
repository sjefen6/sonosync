services:
  sonosync:
    build: .
    container_name: sonosync
    network_mode: "host"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=INFO # Our app logs (INFO, DEBUG, ERROR)
      - DEBUG= # Disable library logs by default for cleaner output
    restart: unless-stopped
