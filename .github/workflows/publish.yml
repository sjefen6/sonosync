name: Publish Docker Image

on:
  push:
    branches: ['main']
    tags: ['v*']

env:
  REGISTRY_GHCR: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating/editing releases
      packages: write # Required for GHCR
      id-token: write # Required for attestations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sonosync
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Automatic volume synchronization for grouped Sonos speakers.
          tags: |
            # Tag with 'main' on push to main branch
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag with 'latest' and version on git tag push
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Tag with short SHA
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Generate Supply Chain Attestations
          sbom: true
          provenance: true

      - name: Create or Update Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          IMG_TAG=${TAG#v}
          
          # Create release if it doesn't exist (using auto-generated notes as base)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating new release for $TAG"
            gh release create "$TAG" --generate-notes
          fi

          PULL_NOTES="

          ### 📥 Docker Pull Commands
          \`\`\`bash
          # From Docker Hub
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/sonosync:${IMG_TAG}

          # From GitHub Container Registry
          docker pull ghcr.io/${{ github.repository }}:${IMG_TAG}
          \`\`\`"
          
          # Fetch current body (which now definitely exists)
          EXISTING_BODY=$(gh release view "$TAG" --json body --template '{{.body}}')
          
          # Append pull commands if not present
          if [[ "$EXISTING_BODY" != *"Docker Pull Commands"* ]]; then
            gh release edit "$TAG" --notes "$EXISTING_BODY$PULL_NOTES"
          fi

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sonosync
