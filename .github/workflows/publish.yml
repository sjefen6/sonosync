name: Publish Docker Image

on:
  push:
    branches: ['main']
    tags: ['v*']

env:
  REGISTRY_GHCR: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for some attestation features

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sonosync
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Automatic volume synchronization for grouped Sonos speakers.
          tags: |
            # Tag with 'main' on push to main branch
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag with 'latest' and version on git tag push
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Tag with short SHA
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Generate Supply Chain Attestations
          sbom: true
          provenance: true

      - name: Update Release with Pull Commands
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          # The image tag (removes 'v' prefix)
          IMG_TAG=${TAG#v}
          
          PULL_NOTES="

          ### 📥 Docker Pull Commands
          \`\`\`bash
          # From Docker Hub
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/sonosync:${IMG_TAG}

          # From GitHub Container Registry
          docker pull ghcr.io/${{ github.repository }}:${IMG_TAG}
          \`\`\`"
          
          # Fetch existing body
          EXISTING_BODY=$(gh release view $TAG --json body --template '{{.body}}' || echo "")
          
          # Only append if not already present
          if [[ "$EXISTING_BODY" != *"Docker Pull Commands"* ]]; then
            gh release edit $TAG --notes "$EXISTING_BODY$PULL_NOTES"
          fi

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sonosync
